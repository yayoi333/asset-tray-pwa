<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>素材ポイっと 送信機</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>素材ポイっと 送信機</h1>
  <button id="signInBtn" type="button" class="ghost">サインイン</button>
</header>

<main>
  <label class="field">
    <span class="label">プロンプト本文</span>
    <textarea id="text" rows="8" placeholder="ここに貼り付け"></textarea>
  </label>
  <button id="pasteBtn" type="button" class="ghost wide">📥 クリップボードから貼り付け</button>

  <label class="field">
    <span class="label">出典URL(共有から開くと自動で入ります)</span>
    <input type="url" id="sourceUrl" placeholder="https://x.com/...">
  </label>

  <label class="field">
    <span class="label">メモ(任意)</span>
    <input type="text" id="memo" placeholder="使いどころなど">
  </label>

  <button id="sendBtn" type="button" class="primary wide">送信</button>
  <p id="status" class="status"></p>

  <section class="recent">
    <h2>最近送ったもの</h2>
    <ul id="recentList"></ul>
  </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
